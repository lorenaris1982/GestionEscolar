<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Modificar mis datos</title>
</head>

<body>

    <h1>Modificar mis datos</h1>

   <form action="/alumno/modificar" method="post">

    <label for="mail">Mail:</label>
    <input type="email" id="mail" name="mail" th:value="${alumno.mail}">

    <br><br>

    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" th:value="${alumno.telefono}">

    <br><br>

    <button type="submit">Guardar cambios</button>

</form>

</body>

</html>
